<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voro – Agent Recruitment Board</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1b2a;--bg:#f4f6fb;--white:#fff;--blue:#2563eb;--blue-lt:#dbeafe;
  --border:#e2e8f0;--text:#1e293b;--muted:#64748b;
  --s1:#6366f1;--s2:#8b5cf6;--s3:#f59e0b;--s4:#22c55e;--s5:#ef4444;
  --panel-w:480px;
}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}

.topbar{flex-shrink:0;background:var(--navy);height:60px;display:flex;align-items:center;padding:0 20px;gap:16px;box-shadow:0 2px 12px rgba(0,0,0,.25);z-index:200}
.logo{font-family:'DM Serif Display',serif;color:#fff;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo span{color:#60a5fa}
.tab-switcher{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:2px;margin-left:12px}
.tab-btn{background:none;border:none;color:rgba(255,255,255,.6);padding:6px 16px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s}
.tab-btn.active{background:#fff;color:var(--navy)}
.tab-count{display:inline-block;background:rgba(0,0,0,.1);border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;margin-left:6px}
.tab-btn:not(.active) .tab-count{background:rgba(255,255,255,.15);color:#fff}
.view-toggle{display:flex;gap:4px;margin-left:auto}
.view-btn{background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;font-size:14px}
.view-btn.active{background:#fff;color:var(--navy)}
.view-btn:hover:not(.active){background:rgba(255,255,255,.2);color:#fff}

.filter-bar{flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.filter-input{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 12px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text);outline:none;width:180px;transition:border-color .15s}
.filter-input:focus{border-color:var(--blue)}
.filter-input::placeholder{color:var(--muted)}
.result-count{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:4px}
.filter-actions{display:flex;gap:8px;margin-left:auto}
.btn-clear{background:none;border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;transition:all .15s}
.btn-clear:hover{background:var(--bg);color:var(--text)}
.btn-simulate{background:linear-gradient(135deg,#f59e0b,#f97316);border:none;border-radius:8px;padding:7px 14px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;color:#fff;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-simulate:hover{opacity:.9;transform:translateY(-1px)}

.stats-strip{flex-shrink:0;background:#fff;border-bottom:1px solid var(--border);padding:8px 20px;display:flex;overflow-x:auto}
.stat-item{display:flex;flex-direction:column;align-items:center;padding:4px 22px;border-right:1px solid var(--border);min-width:100px}
.stat-item:last-child{border-right:none}
.stat-num{font-size:22px;font-weight:700;color:var(--text);line-height:1.1}
.stat-label{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}

.main-wrapper{flex:1;display:flex;overflow:hidden;min-height:0}
.content-area{flex:1;overflow:hidden;min-width:0;transition:all .3s}

.kanban-board{display:flex;gap:14px;padding:18px;height:100%;overflow-x:auto;overflow-y:hidden;align-items:flex-start}
.kanban-col{background:#fff;border-radius:12px;min-width:265px;max-width:265px;display:flex;flex-direction:column;max-height:100%;border-top:4px solid;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.col-header{padding:12px 14px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.col-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.col-count{font-size:20px;font-weight:700;color:var(--text);margin-top:2px}
.col-cards{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.col-cards::-webkit-scrollbar{width:3px}
.col-cards::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.empty-col{text-align:center;color:var(--muted);font-size:12px;padding:24px 10px;font-style:italic}

.agent-card{background:var(--bg);border-radius:10px;padding:11px;cursor:pointer;border:2px solid transparent;transition:all .2s;position:relative}
.agent-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(37,99,235,.12);transform:translateY(-1px)}
.agent-card.selected{border-color:var(--blue);background:#eff6ff}
.card-top{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex-shrink:0;font-size:13px}
.card-info{flex:1;min-width:0}
.card-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-email,.card-company{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-pill{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.s-Pending{background:#eef2ff;color:#4338ca}
.s-Contacted{background:#f3e8ff;color:#6b21a8}
.s-InReview{background:#fef3c7;color:#92400e}
.s-Approved{background:#dcfce7;color:#166534}
.s-Rejected{background:#fee2e2;color:#991b1b}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.meta-tag{font-size:10px;background:#fff;border:1px solid var(--border);padding:1px 6px;border-radius:4px;color:var(--muted)}
.plan-badge{font-size:10px;font-weight:600;padding:1px 7px;border-radius:4px}
.plan-Pro{background:#fef3c7;color:#92400e}
.plan-Basic{background:#f1f5f9;color:#475569}
.note-dot{position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--s3)}

.list-view{padding:18px;height:100%;overflow-y:auto;display:none}
.list-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.list-table th{background:var(--bg);padding:9px 13px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}
.list-table td{padding:9px 13px;font-size:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.list-table tr:last-child td{border-bottom:none}
.list-table tbody tr{cursor:pointer}
.list-table tbody tr:hover td{background:#f8faff}
.list-table tbody tr.sel td{background:#eff6ff}
.step-dot{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;font-weight:700}

body.list-mode .kanban-board{display:none}
body.list-mode .list-view{display:block}

.roster-view{padding:18px;height:100%;overflow-y:auto;display:none}
body.roster-tab .kanban-board,
body.roster-tab .list-view{display:none}
body.roster-tab .roster-view{display:block}
body.roster-tab .view-toggle{visibility:hidden}

.roster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.roster-card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);border:2px solid transparent;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.roster-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--s4),#16a34a)}
.roster-card:hover{border-color:var(--s4);box-shadow:0 6px 16px rgba(34,197,94,.14);transform:translateY(-2px)}
.roster-card.selected{border-color:var(--s4);background:#f0fdf4}
.roster-top{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.roster-avatar{width:48px;height:48px;font-size:17px}
.roster-name{font-size:15px;font-weight:600}
.roster-company{font-size:12px;color:var(--muted);margin-top:1px}
.roster-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px;border-top:1px solid var(--border)}
.roster-stat{text-align:center}
.roster-stat-num{font-size:16px;font-weight:700;color:var(--text)}
.roster-stat-label{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px;margin-top:2px}
.top-perf{position:absolute;top:10px;right:10px;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.3px;box-shadow:0 2px 6px rgba(245,158,11,.4)}
.roster-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.roster-empty-icon{font-size:42px;margin-bottom:12px;opacity:.3}
.roster-empty-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.roster-empty-text{font-size:13px}

.panel-overlay{position:fixed;inset:0;background:rgba(13,27,42,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:90}
.side-panel{position:fixed;top:60px;right:0;bottom:0;width:var(--panel-w);max-width:95vw;background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;display:flex;flex-direction:column;overflow:hidden}
body.panel-open .side-panel{transform:translateX(0)}
body.panel-open .panel-overlay{opacity:1;pointer-events:auto}
.panel-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:12px;flex-shrink:0}
.panel-avatar{width:52px;height:52px;font-size:18px;flex-shrink:0}
.panel-name-block{flex:1;min-width:0}
.panel-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-email{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.panel-close{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.panel-close:hover{background:var(--bg);color:var(--text)}
.panel-body{flex:1;overflow-y:auto;padding:20px}
.panel-section{margin-bottom:18px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.panel-section-header{padding:10px 14px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.panel-section-header .step-num{background:#fff;border:1px solid var(--border);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--text)}
.panel-section-body{padding:6px 14px}
.panel-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;border-bottom:1px dashed var(--border);gap:12px;min-height:36px}
.panel-row:last-child{border-bottom:none}
.panel-row-label{color:var(--muted);flex-shrink:0}
.panel-row-val{font-weight:500;text-align:right;word-break:break-word;max-width:65%}
.panel-row-val.empty{color:#cbd5e1;font-style:italic;font-weight:400}

/* Inline editable */
.editable{cursor:pointer;border-radius:5px;padding:3px 7px;margin:-3px -7px;transition:all .12s;position:relative}
.editable:hover{background:#eff6ff;box-shadow:inset 0 0 0 1px #bfdbfe}
.editable::after{content:"✎";opacity:0;font-size:10px;color:var(--blue);margin-left:6px;transition:opacity .12s}
.editable:hover::after{opacity:.7}
.edit-input,.edit-select{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;padding:4px 7px;border:1px solid var(--blue);border-radius:5px;outline:none;background:#fff;color:var(--text);width:100%;max-width:240px;text-align:right}
.edit-select{text-align:left}

/* Status check pills */
.check-on{display:inline-flex;align-items:center;gap:4px;color:#166534;font-weight:600;font-size:12px;background:#dcfce7;padding:2px 8px;border-radius:6px}
.check-off{display:inline-flex;align-items:center;gap:4px;color:#991b1b;font-weight:600;font-size:12px;background:#fee2e2;padding:2px 8px;border-radius:6px}

/* Notes textarea */
.notes-area{width:100%;min-height:90px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:13px;line-height:1.5;color:var(--text);outline:none;resize:vertical;background:#fff;transition:all .15s}
.notes-area:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.notes-area::placeholder{color:#cbd5e1}
.notes-meta{font-size:10px;color:var(--muted);margin-top:6px;text-align:right}

/* Social media list */
.social-list{display:flex;flex-direction:column;gap:4px;padding:6px 0}
.social-row{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;transition:background .15s}
.social-row:hover{background:var(--bg)}
.social-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;letter-spacing:-.3px}
.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.fb{background:#1877f2}
.li{background:#0a66c2}
.tw{background:#000}
.tt{background:#000}
.yt{background:#ff0000}
.ws{background:linear-gradient(135deg,#6366f1,#8b5cf6)}
.social-text{flex:1;font-size:12px;min-width:0}
.social-text .platform{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;display:block;line-height:1.1;margin-bottom:1px}
.social-handle{font-weight:500;cursor:pointer;border-radius:4px;padding:1px 4px;margin:-1px -4px;display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .12s}
.social-handle:hover{background:#eff6ff;box-shadow:inset 0 0 0 1px #bfdbfe}
.social-handle.empty{color:#cbd5e1;font-style:italic;font-weight:400}
.social-link{color:var(--blue);text-decoration:none;font-size:13px;flex-shrink:0;padding:4px 6px;border-radius:6px;transition:background .15s}
.social-link:hover{background:var(--blue-lt)}

/* Subscriptions */
.subs-group{padding:10px 0;border-bottom:1px dashed var(--border)}
.subs-group:last-child{border-bottom:none}
.subs-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.subs-group-title{font-size:12px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.subs-group-count{font-size:10px;color:var(--muted);background:var(--bg);padding:1px 7px;border-radius:10px;font-weight:600}
.subs-add-btn{background:var(--blue-lt);color:var(--blue);border:none;border-radius:6px;padding:4px 10px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:3px}
.subs-add-btn:hover{background:var(--blue);color:#fff}
.subs-list{display:flex;flex-direction:column;gap:6px}
.subs-item{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg);border-radius:8px;font-size:12px;border:1px solid transparent;transition:all .15s}
.subs-item:hover{border-color:var(--border);background:#fff}
.subs-item.is-cancelling{background:#fff7ed;border-color:#fed7aa}
.subs-item-info{flex:1;min-width:0}
.subs-item-name{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subs-item-meta{font-size:10px;color:var(--muted);margin-top:1px}
.subs-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px;flex-shrink:0;white-space:nowrap}
.sub-active{background:#dcfce7;color:#166534}
.sub-pending{background:#fef3c7;color:#92400e}
.sub-cancelling{background:#ffedd5;color:#9a3412}
.sub-primary{background:var(--blue-lt);color:var(--blue)}
.subs-action-btn{background:none;border:1px solid var(--border);border-radius:5px;padding:3px 7px;font-size:10px;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;flex-shrink:0;white-space:nowrap}
.subs-action-btn:hover{background:#fff;color:var(--text);border-color:var(--text)}
.subs-action-btn.activate{color:#166534;border-color:#bbf7d0}
.subs-action-btn.activate:hover{background:#dcfce7;color:#166534}
.subs-action-btn.cancel{color:#991b1b;border-color:#fecaca}
.subs-action-btn.cancel:hover{background:#fee2e2}
.subs-empty{font-size:11px;color:var(--muted);font-style:italic;text-align:center;padding:8px}
.subs-add-form{display:flex;gap:6px;margin-top:6px;padding:8px;background:var(--blue-lt);border-radius:8px}
.subs-add-form input{flex:1;border:1px solid #bfdbfe;border-radius:6px;padding:5px 8px;font-family:'DM Sans',sans-serif;font-size:12px;outline:none}
.subs-add-form input:focus{border-color:var(--blue)}
.subs-add-form button{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:5px 10px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.subs-add-form button.cancel-add{background:#fff;color:var(--muted);border:1px solid var(--border)}

.subs-summary{display:flex;justify-content:space-between;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:10px;font-size:12px}
.subs-summary-label{color:var(--muted)}
.subs-summary-val{font-weight:700;color:var(--text)}

/* Documents */
.docs-list{display:flex;flex-direction:column;gap:6px;padding:6px 0}
.doc-item{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--bg);border-radius:8px;border:1px solid transparent;transition:all .15s;cursor:pointer}
.doc-item:hover{border-color:var(--border);background:#fff}
.doc-icon{width:32px;height:32px;border-radius:8px;background:#fff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.doc-item.signed .doc-icon{background:#dcfce7;border-color:#bbf7d0}
.doc-item.sent .doc-icon{background:#fef3c7;border-color:#fde68a}
.doc-info{flex:1;min-width:0}
.doc-name{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:10px;color:var(--muted);margin-top:1px}
.doc-actions{display:flex;gap:4px;flex-shrink:0}
.docs-empty{font-size:11px;color:var(--muted);font-style:italic;text-align:center;padding:14px}
.doc-preview-note{font-size:10px;color:var(--muted);background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 9px;margin-top:8px;font-style:italic}

.stepper{display:flex;align-items:center;gap:4px;margin-top:8px}
.step{flex:1;height:6px;background:var(--bg);border-radius:3px}
.step.done{background:var(--s4)}
.step.current{background:var(--blue)}
.step.rejected{background:var(--s5)}
.stepper-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.3px}

.panel-actions{padding:16px 20px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;flex-shrink:0;background:var(--bg)}
.action-row{display:flex;gap:8px}
.action-btn{flex:1;padding:9px 12px;border-radius:8px;border:none;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.action-btn:disabled{opacity:.4;cursor:not-allowed}
.btn-advance{background:var(--blue);color:#fff}
.btn-advance:hover:not(:disabled){background:#1d4ed8}
.btn-approve{background:var(--s4);color:#fff}
.btn-approve:hover:not(:disabled){background:#16a34a}
.btn-reject{background:#fff;color:var(--s5);border:1px solid #fecaca}
.btn-reject:hover:not(:disabled){background:#fef2f2}
.btn-reset{background:#fff;color:var(--muted);border:1px solid var(--border)}
.btn-reset:hover:not(:disabled){background:var(--bg);color:var(--text)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 8px 28px rgba(0,0,0,.25);opacity:0;transition:all .3s;z-index:300;pointer-events:none;display:flex;align-items:center;gap:8px}

.edit-hint{font-size:10px;color:var(--muted);font-style:italic;text-align:center;padding:6px;background:#eff6ff;border-radius:6px;margin-bottom:14px}

function deriveAgent(a, i){
  return {
    id:'a'+i,
    name:`${a.firstName} ${a.lastName}`,
    initials:(a.firstName[0]+a.lastName[0]).toUpperCase(),
    color:PALETTE[i%PALETTE.length],
    location:`${a.city}, ${a.state}`,
    deals:a.deals||0,
    revenue:a.revenue||'$0',
    joined:a.joined||null,
    top:a.top||false,
    business:a.business||'',
    notes:a.notes||'',
    addons:a.addons || {states:[],licenses:[],boards:[],mlses:[]},
    documents:a.documents || [],
    ...a
  };
}

const state = {
  agents: SEED.map(deriveAgent),
  activeTab:'recruitment',
  view:'kanban',
  selectedId:null,
  filters:{search:'',company:'',plan:''},
  addingTo:null  // {agentId, type} when add-on form is open
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const statusKey = s => s.replace(/\s+/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function getField(obj, key){
  return key.split('.').reduce((o,k)=>o==null?undefined:o[k], obj);
}
function setField(obj, key, val){
  const parts = key.split('.');
  let o = obj;
  for(let i=0;i<parts.length-1;i++){
    if(o[parts[i]]==null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length-1]] = val;
}

function filtered(){
  const {search,company,plan} = state.filters;
  return state.agents.filter(a=>{
    if(search && !(a.name.toLowerCase().includes(search.toLowerCase()) || a.email.toLowerCase().includes(search.toLowerCase()))) return false;
    if(company && !a.prevBrokerage.toLowerCase().includes(company.toLowerCase())) return false;
    if(plan && !a.plan.toLowerCase().includes(plan.toLowerCase())) return false;
    return true;
  });
}

function showToast(msg){
  const t = $('#toast');
  t.innerHTML = `<span class="toast-icon">✓</span>${esc(msg)}`;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'),2200);
}

function moveAgent(id,newStatus){
  const a = state.agents.find(x=>x.id===id);
  if(!a) return;
  const old = a.status;
  if(old===newStatus) return;
  a.status = newStatus;
  if(newStatus==='Approved' && !a.joined){
    a.joined = new Date().toISOString().slice(0,10);
    a.deals = a.deals || 0;
    a.revenue = a.revenue || '$0';
  }
  render();
  showToast(`${a.name}: ${old} → ${newStatus}`);
}

function advanceAgent(id){
  const a = state.agents.find(x=>x.id===id);
  if(!a) return;
  const idx = PIPELINE.indexOf(a.status);
  if(idx>=0 && idx<PIPELINE.length-1) moveAgent(id,PIPELINE[idx+1]);
}

function renderStats(){
  const ag = state.agents;
  const counts = STATUSES.reduce((m,s)=>(m[s]=ag.filter(a=>a.status===s).length,m),{});
  const total = ag.length;
  const conv = total ? Math.round(counts['Approved']/total*100) : 0;
  const items = state.activeTab==='recruitment'
    ? [
        ['Total',total,'var(--text)'],
        ['Pending',counts['Pending'],'var(--s1)'],
        ['Contacted',counts['Contacted'],'var(--s2)'],
        ['In Review',counts['In Review'],'var(--s3)'],
        ['Approved',counts['Approved'],'var(--s4)'],
        ['Rejected',counts['Rejected'],'var(--s5)'],
        ['Conversion',conv+'%','var(--text)']
      ]
    : (()=>{
        const approved = ag.filter(a=>a.status==='Approved');
        const top = approved.filter(a=>a.top).length;
        const totalDeals = approved.reduce((s,a)=>s+(a.deals||0),0);
        const pro = approved.filter(a=>a.plan==='Pro').length;
        const totalAddOns = approved.reduce((s,a)=>{
          const ad=a.addons||{};
          return s + (ad.states||[]).length + (ad.licenses||[]).length + (ad.boards||[]).length + (ad.mlses||[]).length;
        },0);
        return [
          ['Active Agents',approved.length,'var(--s4)'],
          ['Top Performers',top,'#f59e0b'],
          ['Pro Plan',pro,'#92400e'],
          ['Add-Ons Active',totalAddOns,'var(--blue)'],
          ['Total Deals',totalDeals,'var(--text)']
        ];
      })();
  $('#statsStrip').innerHTML = items.map(([l,n,c])=>
    `<div class="stat-item"><div class="stat-num" style="color:${c}">${n}</div><div class="stat-label">${l}</div></div>`
  ).join('');
}

function cardHTML(a){
  const ad = a.addons || {};
  const addonCount = (ad.states||[]).length + (ad.licenses||[]).length + (ad.boards||[]).length + (ad.mlses||[]).length;
  return `
    <div class="agent-card ${state.selectedId===a.id?'selected':''}" data-id="${a.id}">
      ${a.notes?'<div class="note-dot" title="Has notes"></div>':''}
      <div class="card-top">
        <div class="avatar" style="background:${a.color}">${a.initials}</div>
        <div class="card-info">
          <div class="card-name">${esc(a.name)}</div>
          <div class="card-email">${esc(a.email)}</div>
        </div>
        <div class="status-pill s-${statusKey(a.status)}">${a.status}</div>
      </div>
      <div class="card-company">${esc(a.prevBrokerage)} · ${esc(a.location)}</div>
      <div class="card-meta">
        <span class="plan-badge plan-${a.plan}">${a.plan}</span>
        <span class="meta-tag">${a.years}+ yrs</span>
        <span class="meta-tag">${esc(a.specialty)}</span>
        ${addonCount?`<span class="meta-tag" style="background:#eff6ff;color:var(--blue);border-color:#bfdbfe">+${addonCount} add-ons</span>`:''}
      </div>
    </div>`;
}

function renderKanban(){
  const list = filtered();
  $('#kanbanBoard').innerHTML = STATUSES.map(s=>{
    const cards = list.filter(a=>a.status===s);
    return `
      <div class="kanban-col" style="border-top-color:${COL_COLORS[s]}">
        <div class="col-header">
          <div class="col-title" style="color:${COL_COLORS[s]}">${s}</div>
          <div class="col-count">${cards.length}</div>
        </div>
        <div class="col-cards">
          ${cards.length ? cards.map(cardHTML).join('') : '<div class="empty-col">No agents</div>'}
        </div>
      </div>`;
  }).join('');
  $$('#kanbanBoard .agent-card').forEach(c=>c.addEventListener('click',()=>openPanel(c.dataset.id)));
}

function renderList(){
  const list = filtered();
  $('#listView').innerHTML = `
    <table class="list-table">
      <thead><tr>
        <th>Stage</th><th>Name</th><th>Brokerage</th><th>Plan</th><th>Status</th><th>Email</th>
      </tr></thead>
      <tbody>
        ${list.map(a=>{
          const idx = STATUSES.indexOf(a.status)+1;
          return `<tr data-id="${a.id}" class="${state.selectedId===a.id?'sel':''}">
            <td><span class="step-dot" style="background:${COL_COLORS[a.status]}">${idx}</span></td>
            <td>${esc(a.name)}</td>
            <td>${esc(a.prevBrokerage)}</td>
            <td><span class="plan-badge plan-${a.plan}">${a.plan}</span></td>
            <td><span class="status-pill s-${statusKey(a.status)}">${a.status}</span></td>
            <td>${esc(a.email)}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  $$('#listView tbody tr').forEach(tr=>tr.addEventListener('click',()=>openPanel(tr.dataset.id)));
}

          ${a.top?'<div class="top-perf">⭐ TOP PERFORMER</div>':''}
          <div class="roster-top">
            <div class="avatar roster-avatar" style="background:${a.color}">${a.initials}</div>
            <div>
              <div class="roster-name">${esc(a.name)}</div>
              <div class="roster-company">${esc(a.prevBrokerage)} · ${esc(a.location)}</div>
            </div>
          </div>
          <div class="roster-stats">
            <div class="roster-stat">
              <div class="roster-stat-num">${a.deals}</div>
              <div class="roster-stat-label">Deals</div>
            </div>

const ADDON_TYPES = [
  {key:'states',  type:'state',   label:'Additional States',     placeholder:'e.g. Connecticut'},
  {key:'licenses',type:'license', label:'Additional Licenses',   placeholder:'e.g. CT-RES.0826554'},
  {key:'boards',  type:'board',   label:'Additional Boards',     placeholder:'e.g. Hudson Gateway Assn'},
  {key:'mlses',   type:'mls',     label:'Additional MLSes',      placeholder:'e.g. OneKey MLS'}
];

function subsItemHTML(agent, listKey, item, idx){
  const cancelling = item.status==='cancelling';
  const pending = item.status==='pending';
  const pillCls = cancelling ? 'sub-cancelling' : (pending ? 'sub-pending' : 'sub-active');
  const pillTxt = cancelling ? 'Cancelling' : (pending ? 'Pending billing' : 'Active');
  const fee = item.fee || `$${ADDON_FEES[listKey.replace(/es?$/,'')]||25}/mo`;
  const displayName = item.number ? `${item.number} (${item.state})` : item.name;
  const meta = [
    `Added ${item.addedDate}`,
    fee
  ].filter(Boolean).join(' · ');
  let actions = '';
  if(pending){
    actions = `<button class="subs-action-btn activate" data-act="activate" data-list="${listKey}" data-idx="${idx}">▶ Activate</button>
               <button class="subs-action-btn cancel" data-act="remove" data-list="${listKey}" data-idx="${idx}">✕</button>`;
  } else if(cancelling){
    actions = `<button class="subs-action-btn cancel" data-act="confirmCancel" data-list="${listKey}" data-idx="${idx}">Confirm cancel</button>`;
  } else {
    actions = `<button class="subs-action-btn cancel" data-act="requestCancel" data-list="${listKey}" data-idx="${idx}">✕ Cancel</button>`;
  }
  return `
    <div class="subs-item ${cancelling?'is-cancelling':''}">
      <div class="subs-item-info">
        <div class="subs-item-name">${esc(displayName)}</div>
        <div class="subs-item-meta">${esc(meta)}</div>
      </div>
      <span class="subs-pill ${pillCls}">${pillTxt}</span>
      <div style="display:flex;gap:4px">${actions}</div>
    </div>`;
}

function subsGroupHTML(agent, group){
  const list = (agent.addons && agent.addons[group.key]) || [];

  const itemsHTML = list.length
    ? list.map((it,i)=>subsItemHTML(agent, group.key, it, i)).join('')

function subscriptionsSectionHTML(agent){
  const ad = agent.addons || {};
  const allItems = [...(ad.states||[]), ...(ad.licenses||[]), ...(ad.boards||[]), ...(ad.mlses||[])];
  const activeItems = allItems.filter(i=>i.status==='active' || !i.status);
  const monthlyTotal = activeItems.reduce((sum,it)=>{
    const m = (it.fee||'').match(/\$(\d+(?:\.\d+)?)/);
    return sum + (m ? parseFloat(m[1]) : (ADDON_FEES[Object.entries(ad).find(([k,v])=>v.includes(it))?.[0]?.replace(/es?$/,'')] || 25));
  }, 0);
  // Estimate fees for items missing fee field
  let monthly = 0;
  ['states','licenses','boards','mlses'].forEach(k=>{
    (ad[k]||[]).filter(i=>i.status==='active'||!i.status).forEach(i=>{
      const m = (i.fee||'').match(/\$(\d+(?:\.\d+)?)/);
      monthly += m ? parseFloat(m[1]) : (ADDON_FEES[k.replace(/es?$/,'')]||25);
    });
  });
  const summary = `<div class="subs-summary">
    <span class="subs-summary-label">Active add-ons</span>
    <span class="subs-summary-val">${activeItems.length} · ~$${monthly.toFixed(0)}/mo</span>
  </div>`;
  return summary + ADDON_TYPES.map(g=>subsGroupHTML(agent, g)).join('');
}

/* Subscription action handlers */
function handleSubsAction(act, agentId, list, idx){
  const a = state.agents.find(x=>x.id===agentId);
  if(!a) return;
  if(!a.addons) a.addons = {states:[],licenses:[],boards:[],mlses:[]};
  if(!a.addons[list]) a.addons[list] = [];
  const arr = a.addons[list];

  if(act==='startAdd'){
    state.addingTo = {agentId, list};
    renderPanel();
    setTimeout(()=>{ const inp = $('#addonInput'); if(inp) inp.focus(); },10);
    return;
  }
  if(act==='cancelAdd'){
    state.addingTo = null;
    renderPanel();
    return;
  }
  if(act==='confirmAdd'){
    const inp = $('#addonInput');
    const val = inp ? inp.value.trim() : '';
    if(!val){ if(inp) inp.focus(); return; }
    const today = new Date().toISOString().slice(0,10);
    const fee = `$${ADDON_FEES[list.replace(/es?$/,'')]||25}/mo`;
    let newItem;
    if(list==='licenses'){
      // Try to parse "STATE-NUMBER" pattern
      const m = val.match(/^([A-Z]{2})[-\s]/i);
      newItem = {number:val, state:m?m[1].toUpperCase():'—', exp:'', status:'pending', addedDate:today, fee};
    } else if(list==='states'){
      newItem = {name:val, status:'pending', addedDate:today, fee};
    } else {
      newItem = {name:val, status:'pending', addedDate:today, fee};
    }
    arr.push(newItem);
    state.addingTo = null;
    render();
    showToast(`${val} added — pending billing`);
    return;
  }
  if(act==='activate'){
    if(arr[idx]) arr[idx].status='active';
    render();
    showToast('Activated · billing complete');
    return;
  }
  if(act==='requestCancel'){
    if(arr[idx]) arr[idx].status='cancelling';
    render();
    showToast('Cancellation requested');
    return;
  }
  if(act==='confirmCancel' || act==='remove'){
    arr.splice(idx,1);
    render();
    showToast('Removed from subscriptions');
    return;
  }
}

function handleDocAction(act, agentId, idx){
  const a = state.agents.find(x=>x.id===agentId);
  if(!a) return;
  if(!a.documents) a.documents = [];

  if(act==='startSendDoc'){
    state.addingTo = {agentId, list:'documents'};
    renderPanel();
    setTimeout(()=>{ const inp=$('#docInput'); if(inp) inp.focus(); },10);
    return;
  }
  if(act==='cancelSendDoc'){
    state.addingTo = null;
    renderPanel();
    return;
  }
  if(act==='confirmSendDoc'){
    const inp = $('#docInput');
    const val = inp ? inp.value.trim() : '';
    if(!val){ if(inp) inp.focus(); return; }
    a.documents.push({name:val, status:'sent', sentDate:new Date().toISOString().slice(0,10)});
    state.addingTo = null;
    renderPanel();
    showToast(`Sent "${val}" for signature`);
    return;
  }
  if(act==='markSigned'){
    if(a.documents[idx]){
      a.documents[idx].status = 'signed';
      a.documents[idx].signedDate = new Date().toISOString().slice(0,10);
    }
    renderPanel();
    showToast('Marked as signed');
    return;
  }
  if(act==='downloadDoc'){
    showToast('Download (mock) — would fetch signed PDF here');
    return;
  }
}

/* ── INLINE EDITING ───────────────────────────────────────────────── */
function startEdit(span){
  if(span.classList.contains('editing')) return;
  const id = span.dataset.id;
  const key = span.dataset.key;
  const type = span.dataset.type || 'text';
  const choices = span.dataset.choices ? JSON.parse(span.dataset.choices) : null;
  const agent = state.agents.find(a=>a.id===id);
  if(!agent) return;
  const currentVal = getField(agent, key);
  const displayVal = currentVal==null ? '' : String(currentVal);
  const originalText = span.textContent;
  let input;
  if(choices){
    input = document.createElement('select');
    input.className = 'edit-select';
    if(!choices.includes(displayVal) && displayVal!==''){
      const o=document.createElement('option');o.value=displayVal;o.textContent=displayVal;input.appendChild(o);
    }
    choices.forEach(c=>{
      const o=document.createElement('option');o.value=c;o.textContent=c;
      if(c===displayVal) o.selected=true;
      input.appendChild(o);
    });
  } else {
    input = document.createElement('input');
    input.type = type;
    input.className = 'edit-input';
    input.value = displayVal;
  }
  span.classList.add('editing');
  span.textContent = '';
  span.appendChild(input);
  input.focus();
  if(input.select) try{input.select()}catch(e){}
  let cancelled=false, done=false;
  const finish = () => {
    if(done) return; done=true;
    if(cancelled){ span.textContent=originalText; span.classList.remove('editing'); return; }
    const newVal = input.value.trim();
    setField(agent, key, newVal);
    if(key==='firstName'||key==='lastName'){
      agent.name = `${agent.firstName} ${agent.lastName}`;
      if(agent.firstName && agent.lastName) agent.initials = (agent.firstName[0]+agent.lastName[0]).toUpperCase();
    }
    if(key==='city'||key==='state') agent.location = `${agent.city||''}${agent.city&&agent.state?', ':''}${agent.state||''}`;
    if(key==='icaSigned') agent.icaSigned = newVal || null;
    if(key==='w9Date'){ agent.w9Date = newVal || null; agent.w9OnFile = !!newVal; }
    render();
    showToast('Updated');
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); input.blur(); }
    else if(e.key==='Escape'){ cancelled=true; input.blur(); }
  });
}

function setupEditing(){
  $$('#panelBody .editable, #panelBody .social-handle').forEach(el=>{
    el.addEventListener('click', e=>{ e.stopPropagation(); startEdit(el); });
  });
  const notesArea = $('#notesArea');
  if(notesArea){
    notesArea.addEventListener('input', ()=>{
      const a = state.agents.find(x=>x.id===notesArea.dataset.id);
      if(a){
        a.notes = notesArea.value;
        const meta = $('#notesMeta');
        if(meta) meta.textContent = `${a.notes.length} chars · saved`;
      }
    });
    notesArea.addEventListener('blur', ()=>{
      if(state.activeTab==='recruitment') state.view==='list'?renderList():renderKanban();
    });
  }
  // Subscription action buttons
  $$('#panelBody [data-act]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const act = btn.dataset.act;
      const agentId = state.selectedId;
      // Document actions
      if(act.startsWith('startSendDoc')||act==='confirmSendDoc'||act==='cancelSendDoc'||act==='markSigned'||act==='downloadDoc'){
        handleDocAction(act, agentId, parseInt(btn.dataset.idx||'0',10));
        return;
      }
      // Subscription actions
      const list = btn.dataset.list;
      const idx = parseInt(btn.dataset.idx||'0',10);
      handleSubsAction(act, agentId, list, idx);
    });
  });
  // Enter key in add-on inputs
  const addonInput = $('#addonInput');
  if(addonInput){
    addonInput.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); handleSubsAction('confirmAdd', state.selectedId, state.addingTo?.list); }
      else if(e.key==='Escape'){ handleSubsAction('cancelAdd'); }
    });
  }
  const docInput = $('#docInput');
  if(docInput){
    docInput.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); handleDocAction('confirmSendDoc', state.selectedId); }
      else if(e.key==='Escape'){ handleDocAction('cancelSendDoc', state.selectedId); }
    });
  }
}

  } else if(a.status==='Approved'){
    actionsHTML = `<div class="action-row">
      <button class="action-btn btn-reset" data-act="back">← Back to Review</button>
      <button class="action-btn btn-reject" data-act="reject">Revoke</button>
    </div>`;
  } else {
    actionsHTML = `
      ${canAdvance?`<div class="action-row"><button class="action-btn btn-advance" data-act="advance">Move to ${nextLabel} →</button></div>`:''}
      <div class="action-row">
        <button class="action-btn btn-approve" data-act="approve">✓ Approve</button>
        <button class="action-btn btn-reject" data-act="reject">✕ Reject</button>
      </div>`;
  }
  $('#panelActions').innerHTML = actionsHTML;
  $$('#panelActions [data-act]').forEach(b=>b.addEventListener('click',()=>{
    const act = b.dataset.act;
    if(act==='advance') advanceAgent(a.id);
    else if(act==='approve') moveAgent(a.id,'Approved');
    else if(act==='reject') moveAgent(a.id,'Rejected');
    else if(act==='reset') moveAgent(a.id,'Pending');
    else if(act==='back'){ const i = PIPELINE.indexOf(a.status); if(i>0) moveAgent(a.id,PIPELINE[i-1]); }
  }));

  setupEditing();
}

function render(){
  $('#tabCountRec').textContent = state.agents.length;
  $('#tabCountRos').textContent = state.agents.filter(a=>a.status==='Approved').length;
  const f = filtered();
  $('#resultCount').textContent = `${f.length} of ${state.agents.length} agents`;
  renderStats();
  if(state.activeTab==='recruitment'){renderKanban();renderList();}
  else {renderRoster();}
  if(state.selectedId) renderPanel();
}

$('#tabSwitcher').addEventListener('click',e=>{
  const btn = e.target.closest('.tab-btn');
  if(!btn) return;
  $$('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.activeTab = btn.dataset.tab;
  document.body.classList.toggle('roster-tab', state.activeTab==='roster');
  render();
});

$('#viewToggle').addEventListener('click',e=>{
  const btn = e.target.closest('.view-btn');
  if(!btn) return;
  $$('.view-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.view = btn.dataset.view;
  document.body.classList.toggle('list-mode', state.view==='list');
});

$('#searchInput').addEventListener('input',e=>{state.filters.search=e.target.value;render()});
$('#companyInput').addEventListener('input',e=>{state.filters.company=e.target.value;render()});
$('#planInput').addEventListener('input',e=>{state.filters.plan=e.target.value;render()});
$('#clearBtn').addEventListener('click',()=>{
  state.filters={search:'',company:'',plan:''};
  $('#searchInput').value='';$('#companyInput').value='';$('#planInput').value='';
  render();
  showToast('Filters cleared');
});

$('#simulateBtn').addEventListener('click',()=>{
  const movable = state.agents.filter(a=>PIPELINE.indexOf(a.status)>=0 && PIPELINE.indexOf(a.status)<PIPELINE.length-1);
  if(!movable.length){showToast('No agents to advance');return}
  const pick = movable[Math.floor(Math.random()*movable.length)];
  const idx = PIPELINE.indexOf(pick.status);
  const newStatus = PIPELINE[idx+1];
  pick.status = newStatus;
  if(newStatus==='Approved' && !pick.joined) pick.joined = new Date().toISOString().slice(0,10);
  render();
  showToast(`Batch run: ${pick.name} advanced to ${newStatus}`);
});

$('#panelOverlay').addEventListener('click',closePanel);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape' && !document.activeElement?.matches('input,select,textarea')) closePanel();
});

render();
</script>
</body>
</html>
